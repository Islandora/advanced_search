advanced_search.settings:
  type: config_object
  mapping:
    lucene_on_off:
      type: integer
      label: Enable Extended DisMax Query
    lucene_label: 
      type: string
      label: Set the label for the option of searching all fields
    all_fields_on_off:
      type: integer
      label: Enable searching all fields
    list_on_off:
      type: integer
      label: Expose "List view" option
    grid_on_off:
      type: integer
      label: Expose "Grid view" option.
    default-display-mode:
      type: string
      label: Default view mode
    search_query_parameter:
      type: string
      label: Search Query Parameter
    search_recursive_parameter:
      type: string
      label: Recurse Query Parameter
    search_add_operator:
      type: string
      label: Facet Add Operator
    search_remove_operator:
      type: string
      label: Facet Remove Operator
    facet_truncate:
      type: string
      label: Truncate Facet
    recursive:
      type: integer
      label: Include Sub-Collections
    query_fields:
      type: sequence
      label: Query Fields
      sequence:
        type: string
        label: Field identifier
    no_follow:
      type: integer
      label: Add rel="nofollow" attribute in links

block.settings.search_block:
  type: block_settings
  label: 'Search block'
  mapping:
    block_id:
      type: string
      label: 'Block ID'
    search_view_machine_name:
      type: string
      label: 'Search view machine name'
    search_textfield_label:
      type: label
      label: 'Search text field label'
    search_placeholder:
      type: label
      label: 'Search placeholder text'
    search_submit_label:
      type: label
      label: 'Search button label'

views.area.advanced_search_form:
  type: views_area
  label: 'Advanced Search form'
  mapping:
    fields:
      type: sequence
      label: 'Search fields'
      sequence:
        type: string
        label: 'Search API field identifier'
    context_filter:
      type: string
      label: 'Direct-child contextual filter'

views.area.advanced_search_results_toolbar:
  type: views_area
  label: 'Advanced Search results toolbar'
  mapping:
    override_list_on_off:
      type: boolean
      label: 'Expose the List view option'
    override_grid_on_off:
      type: boolean
      label: 'Expose the Grid view option'
    override-default-display-mode:
      type: string
      label: 'Default view mode'
      constraints:
        Choice:
          - list
          - grid
