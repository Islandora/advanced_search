services:
  advanced_search.query_factory:
    class: Drupal\advanced_search\AdvancedSearchQueryFactory
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@request_stack'
      - '@router'
  advanced_search.query:
    class: Drupal\advanced_search\AdvancedSearchQuery
    factory: ['@advanced_search.query_factory', 'create']
  advanced_search.search_results_toolbar_builder:
    class: Drupal\advanced_search\SearchResultsToolbarBuilder
    arguments:
      - '@config.factory'
      - '@request_stack'
      - '@path.current'
      - '@string_translation'
  Drupal\advanced_search\EventSubscriber\PostConvertedQueryEventSubscriber:
    arguments:
      - '@advanced_search.query'
      - '@request_stack'
    tags:
      - { name: 'event_subscriber' }
